<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.divinty5.DiTunnel.Network1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="GetCapabilities"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="Probe"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="CancelProbe"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="Connect"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="Disconnect"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="GetStatus"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.divinty5.DiTunnel.Network1" send_member="RestoreNetwork"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.divinty5.DiTunnel.Network1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
